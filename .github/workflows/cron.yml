name: Cron

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

env:
  APP_ID: ${{ secrets.APP_ID }}
  APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
  APP_INSTALLATION_ID: ${{ secrets.APP_INSTALLATION_ID }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  VOYAGEAI_API_KEY: ${{ secrets.VOYAGEAI_API_KEY }}
  EMBEDDINGS_QUEUE_ENABLED: ${{ secrets.EMBEDDINGS_QUEUE_ENABLED || 'true' }}
  EMBEDDINGS_QUEUE_BATCH_SIZE: ${{ secrets.EMBEDDINGS_QUEUE_BATCH_SIZE || '50' }}
  EMBEDDINGS_QUEUE_DELAY_MS: ${{ secrets.EMBEDDINGS_QUEUE_DELAY_MS || '1000' }}
  EMBEDDINGS_QUEUE_MAX_RETRIES: ${{ secrets.EMBEDDINGS_QUEUE_MAX_RETRIES || '3' }}
  EMBEDDINGS_QUEUE_CONCURRENCY: ${{ secrets.EMBEDDINGS_QUEUE_CONCURRENCY || '1' }}
  EMBEDDINGS_QUEUE_MAX_TOKENS_PER_BATCH: ${{ secrets.EMBEDDINGS_QUEUE_MAX_TOKENS_PER_BATCH || '60000' }}

jobs:
  run-cron:
    environment: ${{ github.ref == 'refs/heads/main' && 'main' || 'development' }}
    name: Run Cron
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Install packages
        run: bun install --frozen-lockfile

      - name: Get GitHub App token
        if: env.APP_ID != '' && env.APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}

      - name: Run CRON job
        run: |
          deno run --unstable-sloppy-imports --allow-all src/cron/index.ts
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
